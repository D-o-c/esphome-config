---
  # WeMos C3 mini
  #
  # https://docs.platformio.org/en/latest/boards/espressif32/lolin_c3_mini.html
  #
  esphome:
    <<: !include .esphome.yaml
    platformio_options:
      # Force official PlatformIO ESP32 platform (avoid PIOArduino)
      platform: platformio/espressif32@6.12.0
      board_build.extra_flags:
        - "-DARDUINO_USB_CDC_ON_BOOT=0"
      board_build.flash_mode: dio

  esp32:
    board: lolin_c3_mini
    variant: ESP32C3
    framework:
      type: esp-idf

  wifi:
    output_power: 8.5dBm

  i2c:
    scan: true
    sda: GPIO8
    scl: GPIO10

  sensor:
    - platform: internal_temperature
      name: "CPU Temperature"

  button:
    - platform: safe_mode
      name: "Restart (Safe Mode)"
      entity_category: diagnostic